# Longlist of niches that can be produced 100% with Python code (no generative AI, no Blender).
# codeability is Claude's own 1-5 judgement (5 = pure code, minutes of render, no licensed assets).
# Muse/Iqbal may PROPOSE more niches in comms/from-muse; do not edit this file directly.
niches:
  - id: musical_marble_run
    label: Marble/ball runs that play a melody
    codeability: 5
    queries: ["marble run music", "ball bounce piano satisfying"]
  - id: ball_physics_satisfying
    label: Satisfying 2D ball/physics simulations
    codeability: 5
    queries: ["satisfying ball simulation", "physics simulation satisfying"]
  - id: domino_chain_reaction
    label: Domino / chain-reaction simulations
    codeability: 5
    queries: ["domino chain reaction simulation", "chain reaction simulation satisfying"]
  - id: particle_sim
    label: Particle / sand / fluid-style simulations
    codeability: 5
    queries: ["particle simulation satisfying", "falling sand simulation"]
  - id: data_ranking_race
    label: Animated ranking / bar-chart-race data shorts
    codeability: 5
    queries: ["bar chart race", "data ranking animation"]
  - id: map_data
    label: Animated maps and geography data
    codeability: 4
    queries: ["map animation countries data", "geography data animated"]
  - id: scale_comparison
    label: Size / scale comparisons (planets, animals, numbers)
    codeability: 4
    queries: ["size comparison animation", "scale of the universe comparison"]
  - id: algorithm_visualizer
    label: Sorting / pathfinding algorithm visualizations
    codeability: 5
    queries: ["sorting algorithm visualization", "pathfinding visualization"]
  - id: math_visual
    label: Math visualizations (Manim-style)
    codeability: 4
    queries: ["math visualization short", "manim animation"]
  - id: fractal_zoom
    label: Fractal zooms and procedural patterns
    codeability: 4
    queries: ["fractal zoom", "mandelbrot zoom"]
  - id: generative_art
    label: Generative art (flow fields, cellular automata)
    codeability: 5
    queries: ["generative art code", "cellular automata"]
  - id: evolution_sim
    label: Evolution / natural-selection simulations
    codeability: 4
    queries: ["evolution simulation", "natural selection simulation"]
  - id: kinetic_typography_facts
    label: Kinetic-typography fact shorts (text only)
    codeability: 4
    queries: ["kinetic typography facts", "animated text facts"]
